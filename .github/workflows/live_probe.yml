name: Live probe every 2h

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-probe-public
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout public (live.txt)
        uses: actions/checkout@v4

      - name: Fetch private scripts
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/Reed3130/AVK-VPN-private.git" /tmp/private
          cd /tmp/private
          git sparse-checkout set scripts/live_probe
          ls -la scripts/live_probe/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySocks
        run: pip install --quiet PySocks==1.7.1

      - name: Install Xray
        run: |
          set -e
          VER=25.10.15
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${VER}/Xray-linux-64.zip"
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          echo "XRAY_BIN=/usr/local/bin/xray" >> "$GITHUB_ENV"

      - name: Run cycle from private scripts
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          cd /tmp/private
          python3 scripts/live_probe/probe_live.py
          cp -f live.txt "$GITHUB_WORKSPACE/live.txt"
          wc -l live.txt
          cat scripts/live_probe/live_meta.env || true

      - name: Commit only live.txt to public
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          git config user.name "live-probe"
          git config user.email "probe@users.noreply.github.com"
          git add live.txt
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "live update $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
