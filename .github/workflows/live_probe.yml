name: Live probe every 2h

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: live-probe-public
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PySocks
        run: pip install --quiet PySocks==1.7.1

      - name: Install Xray
        run: |
          set -e
          VER=25.10.15
          curl -fsSL -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/v${VER}/Xray-linux-64.zip"
          sudo unzip -o /tmp/xray.zip xray -d /usr/local/bin
          sudo chmod +x /usr/local/bin/xray
          /usr/local/bin/xray version | head -2
          echo "XRAY_BIN=/usr/local/bin/xray" >> "$GITHUB_ENV"

      - name: Run immutable cycle
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -e
          echo "=== public cycle start $(date -u +%Y-%m-%dT%H:%M:%SZ) ==="
          python3 scripts/live_probe/probe_live.py
          wc -l live.txt || true
          cat scripts/live_probe/live_meta.env || true

      - name: Commit live.txt status README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/live_probe/push_live_api.py

      - name: Upload artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: live-txt
          path: live.txt
          if-no-files-found: warn
